name: Remove waiting-on-author when author responds

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  remove-label:
    if: |
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.issue.state == 'open' &&
        contains(join(github.event.issue.labels.*.name, ','), 'waiting-on-author') &&
        github.event.comment.user.login == github.event.issue.user.login &&
        github.event.comment.user.type != 'Bot'
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        github.event.pull_request.state == 'open' &&
        contains(join(github.event.pull_request.labels.*.name, ','), 'waiting-on-author') &&
        github.event.comment.user.login == github.event.pull_request.user.login
      ) || (
        github.event_name == 'pull_request' &&
        github.event.action == 'synchronize' &&
        github.event.pull_request.state == 'open' &&
        contains(join(github.event.pull_request.labels.*.name, ','), 'waiting-on-author') &&
        github.event.sender.login == github.event.pull_request.user.login
      )
    runs-on: ubuntu-latest
    steps:
      - name: Remove waiting-on-author label
        uses: actions/github-script@v7
        with:
          # 优先用 PAT；若 secret 未配置则回退到 GITHUB_TOKEN（同仓 PR 可用）
          github-token: ${{ secrets.LABEL_TOKEN || github.token }}
          script: |
            const LABEL = 'waiting-on-author';
            const issue_number =
              context.payload.issue?.number ||
              context.payload.pull_request.number;

            const tokenSource = process.env.GITHUB_TOKEN ? 'token-present' : 'token-missing';
            console.log(`Using token (${tokenSource}), issue #${issue_number}`);

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                name: LABEL
              });
              console.log(`Removed "${LABEL}" from #${issue_number}`);
            } catch (e) {
              if (e.status === 404) {
                console.log(`Label already absent on #${issue_number}`);
              } else {
                console.error(`removeLabel failed: status=${e.status} message=${e.message}`);
                throw e;
              }
            }
