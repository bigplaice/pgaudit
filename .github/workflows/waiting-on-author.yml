name: Waiting on Author (unresolved reviews / unanswered @mentions)

on:
  schedule:
    # 每天 UTC 00:00（约北京时间 08:00）
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-waiting-on-author:
    runs-on: ubuntu-latest
    steps:
      - name: Scan open PRs
        uses: actions/github-script@v7
        with:
          script: |
            const DAYS_THRESHOLD = 15;
            const LABEL = 'waiting-on-author';
            const msPerDay = 24 * 60 * 60 * 1000;
            const now = Date.now();

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // ---------- 确保标签存在 ----------
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: LABEL,
                  color: 'fbca04',
                  description: 'Author has not responded to review comments or @mentions for a long time'
                });
                console.log(`Created label: ${LABEL}`);
              } else {
                throw e;
              }
            }

            // ---------- 分页获取所有 open PR ----------
            const openPRs = [];
            let hasNextPage = true;
            let cursor = null;

            while (hasNextPage) {
              const query = `
                query($owner: String!, $repo: String!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequests(first: 30, states: OPEN, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        number
                        title
                        url
                        isDraft
                        createdAt
                        author { login }
                        labels(first: 30) { nodes { name } }
                      }
                    }
                  }
                }
              `;
              const result = await github.graphql(query, { owner, repo, cursor });
              const conn = result.repository.pullRequests;
              openPRs.push(...conn.nodes);
              hasNextPage = conn.pageInfo.hasNextPage;
              cursor = conn.pageInfo.endCursor;
            }

            console.log(`Found ${openPRs.length} open PR(s)`);

            // ---------- 工具函数 ----------
            function daysSince(isoOrMs) {
              const t = typeof isoOrMs === 'number' ? isoOrMs : new Date(isoOrMs).getTime();
              return (now - t) / msPerDay;
            }

            // 获取 PR 上作者在某时间点之后是否有 commit（推代码算回复）
            async function authorPushedAfter(prNumber, afterMs, authorLogin) {
              try {
                const commits = await github.paginate(
                  github.rest.pulls.listCommits,
                  { owner, repo, pull_number: prNumber, per_page: 100 }
                );
                return commits.some(c => {
                  const login =
                    c.author?.login ||
                    c.committer?.login ||
                    '';
                  // commit 时间用 commit.author.date
                  const dateStr = c.commit?.author?.date || c.commit?.committer?.date;
                  if (!dateStr) return false;
                  const t = new Date(dateStr).getTime();
                  // 作者匹配：优先 GitHub login，其次 commit 名字不好可靠，这里主要靠 login
                  const isAuthor =
                    login.toLowerCase() === authorLogin.toLowerCase();
                  return isAuthor && t > afterMs;
                });
              } catch (e) {
                console.warn(`PR #${prNumber}: listCommits failed: ${e.message}`);
                return false;
              }
            }

            // ---------- 逐个 PR 检查 ----------
            for (const pr of openPRs) {
              const prNumber = pr.number;
              const authorLogin = pr.author?.login;

              if (pr.isDraft) {
                console.log(`PR #${prNumber}: draft, skip`);
                continue;
              }
              if (!authorLogin) {
                console.log(`PR #${prNumber}: no author, skip`);
                continue;
              }

              // 已有标签 → 什么也不做
              const hasLabel = pr.labels.nodes.some(l => l.name === LABEL);
              if (hasLabel) {
                console.log(`PR #${prNumber}: already has ${LABEL}, skip`);
                continue;
              }

              let shouldLabel = false;
              let reason = '';
              let waitDays = 0;

              // ===== 情况 1：未解决的 review threads =====
              {
                const unresolved = [];
                let tHasNext = true;
                let tCursor = null;

                while (tHasNext) {
                  const tq = `
                    query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $number) {
                          reviewThreads(first: 50, after: $cursor) {
                            pageInfo { hasNextPage endCursor }
                            nodes {
                              isResolved
                              comments(first: 50) {
                                nodes {
                                  author { login }
                                  createdAt
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  `;
                  const tr = await github.graphql(tq, {
                    owner, repo, number: prNumber, cursor: tCursor
                  });
                  const threads = tr.repository.pullRequest.reviewThreads;
                  for (const th of threads.nodes) {
                    if (!th.isResolved) unresolved.push(th);
                  }
                  tHasNext = threads.pageInfo.hasNextPage;
                  tCursor = threads.pageInfo.endCursor;
                }

                if (unresolved.length > 0) {
                  // 取所有未解决 thread 中「最后一条非作者评论」的时间，取最早的那次（等待最久的）
                  let oldestWaitingMs = null;

                  for (const th of unresolved) {
                    const comments = th.comments.nodes || [];
                    // 从后往前找最后一条非作者评论
                    let lastNonAuthorMs = null;
                    for (let i = comments.length - 1; i >= 0; i--) {
                      const c = comments[i];
                      const login = c.author?.login;
                      if (login && login !== authorLogin) {
                        lastNonAuthorMs = new Date(c.createdAt).getTime();
                        break;
                      }
                    }
                    // 若整条 thread 全是作者自己的评论，用第一条评论时间兜底
                    if (lastNonAuthorMs === null && comments.length > 0) {
                      lastNonAuthorMs = new Date(comments[0].createdAt).getTime();
                    }
                    if (lastNonAuthorMs !== null) {
                      if (oldestWaitingMs === null || lastNonAuthorMs < oldestWaitingMs) {
                        oldestWaitingMs = lastNonAuthorMs;
                      }
                    }
                  }

                  if (oldestWaitingMs !== null) {
                    const d = daysSince(oldestWaitingMs);
                    if (d >= DAYS_THRESHOLD) {
                      shouldLabel = true;
                      waitDays = Math.floor(d);
                      reason = `存在未解决的 review 评论（已等待约 ${waitDays} 天）`;
                    }
                  }
                }
              }

              // ===== 情况 2：Conversation 里被 @ 后未回复 =====
              // 作者发表任意评论算回复；推代码也算回复
              if (!shouldLabel) {
                // 拉取 issue comments（Conversation 普通评论）
                const comments = await github.paginate(
                  github.rest.issues.listComments,
                  { owner, repo, issue_number: prNumber, per_page: 100 }
                );

                // 按时间排序
                comments.sort((a, b) =>
                  new Date(a.created_at) - new Date(b.created_at)
                );

                const mentionRe = new RegExp(`@${authorLogin}\\b`, 'i');

                for (const c of comments) {
                  // 只关心「别人」@ 了作者
                  if (c.user.login === authorLogin) continue;
                  if (c.user.type === 'Bot') continue;
                  if (!mentionRe.test(c.body || '')) continue;

                  const mentionMs = new Date(c.created_at).getTime();
                  const d = daysSince(mentionMs);
                  if (d < DAYS_THRESHOLD) continue;

                  // 作者在此之后是否发过任意评论？
                  const authorCommentedAfter = comments.some(
                    x =>
                      x.user.login === authorLogin &&
                      new Date(x.created_at).getTime() > mentionMs
                  );
                  if (authorCommentedAfter) continue;

                  // 作者在此之后是否推过代码？
                  const pushed = await authorPushedAfter(
                    prNumber,
                    mentionMs,
                    authorLogin
                  );
                  if (pushed) continue;

                  // 被 @ 后既没评论也没推代码，且超过 15 天
                  shouldLabel = true;
                  waitDays = Math.floor(d);
                  reason = `Conversation 中被 @ 后未回复（已等待约 ${waitDays} 天）`;
                  break;
                }
              }

              // ===== 触发：打标签 + 评论提醒 =====
              if (shouldLabel) {
                console.log(`PR #${prNumber}: labeling — ${reason}`);

                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: prNumber,
                  labels: [LABEL]
                });

                const body = [
                  `Hi @${authorLogin},`,
                  ``,
                  `This pull request has been waiting for your response for about **${waitDays} days**.`,
                  ``,
                  `**Reason:** ${reason}`,
                  ``,
                  `Please:`,
                  `- reply to the pending review comments / conversation, or`,
                  `- push updates addressing the feedback, or`,
                  `- let us know if you need more time / want to close this PR.`,
                  ``,
                  `This is an automated reminder. The label \`${LABEL}\` was added so maintainers can track it.`,
                  ``,
                  `Thank you!`
                ].join('\n');

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body
                });

                console.log(`PR #${prNumber}: labeled and commented`);
              } else {
                console.log(`PR #${prNumber}: OK, no action`);
              }
            }

            console.log('Done.');